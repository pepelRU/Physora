name: Physora

options:
  bundleIdPrefix: com.pepelru
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    CODE_SIGN_STYLE: Automatic

targets:
  Physora:
    type: application
    platform: iOS
    sources:
      - path: Physora
    settings:
      base:
        INFOPLIST_FILE: Support/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.pepelru.physora
        PRODUCT_NAME: Physora
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies: []

  PhysoraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PhysoraTests
    dependencies:
      - target: Physora
    hostApplication: Physora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pepelru.physora.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Physora

schemes:
  Physora:
    build:
      targets:
        Physora: all
        PhysoraTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: PhysoraTests
    archive:
      config: Release
