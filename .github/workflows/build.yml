name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode build and unit tests
    runs-on: macos-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Inspect committed Xcode project
        run: |
          xcodebuild -list -project Physora.xcodeproj

      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Physora.xcodeproj \
            -scheme Physora \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee build.log

      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "iPhone simulator: $UDID"
          echo "id=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project Physora.xcodeproj \
            -scheme Physora \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO | tee test.log

      - name: Capture simulator screenshots
        if: always()
        continue-on-error: true
        shell: bash
        env:
          UDID: ${{ steps.simulator.outputs.id }}
        run: |
          APP="build/Build/Products/Debug-iphonesimulator/Physora.app"
          if [ ! -d "$APP" ] || [ -z "$UDID" ]; then
            echo "App or simulator is unavailable"
            exit 0
          fi
          mkdir -p artifacts
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4 2>/dev/null || true
          # Give SpringBoard time to finish its first-boot banners before capture.
          sleep 15

          capture() {
            local name="$1"
            shift
            xcrun simctl terminate "$UDID" com.pepelru.physora 2>/dev/null || true
            xcrun simctl launch "$UDID" com.pepelru.physora "$@" >/dev/null
            sleep 4
            xcrun simctl io "$UDID" screenshot "artifacts/${name}.png"
          }

          xcrun simctl ui "$UDID" appearance light
          capture home-light -physoraScreenshots -physoraTab home
          capture solution-light -physoraScreenshots -physoraTab home -physoraScreen solution
          capture settings-light -physoraScreenshots -physoraTab settings
          capture reference-light -physoraScreenshots -physoraTab reference
          capture chats-light -physoraScreenshots -physoraTab home -physoraScreen history
          capture tools-light -physoraScreenshots -physoraTab home -physoraScreen tools

          xcrun simctl ui "$UDID" appearance dark
          capture home-dark -physoraScreenshots -physoraTab home
          capture solution-dark -physoraScreenshots -physoraTab home -physoraScreen solution
          capture settings-dark -physoraScreenshots -physoraTab settings
          capture reference-dark -physoraScreenshots -physoraTab reference
          capture chats-dark -physoraScreenshots -physoraTab home -physoraScreen history
          capture tools-dark -physoraScreenshots -physoraTab home -physoraScreen tools

      - name: Copy screenshots to Docs/Screenshots
        if: always()
        shell: bash
        run: |
          mkdir -p Docs/Screenshots
          cp artifacts/*.png Docs/Screenshots/

      - name: Build unsigned app for iPhone
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Physora.xcodeproj \
            -scheme Physora \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee device-build.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          APP_PATH="build-device/Build/Products/Release-iphoneos/Physora.app"
          test -d "$APP_PATH"
          rm -rf Payload Physora.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Physora.ipa
          ls -lh Physora.ipa
          ditto -c -k --keepParent "$APP_PATH" artifacts/Physora-device.app.zip
          cp Physora.ipa artifacts/Physora.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Physora-unsigned-ipa
          path: Physora.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest IPA release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Physora latest build
          body: |
            Unsigned IPA built from ${{ github.sha }}.

            This build is not signed with an Apple Development certificate. Use your own signing workflow / LiveContainer, or open the Xcode project and run on your device with a development team.
          prerelease: true
          overwrite_files: true
          files: Physora.ipa

      - name: Package project and simulator app
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -d Physora.xcodeproj ]; then
            ditto -c -k --sequesterRsrc --keepParent Physora.xcodeproj artifacts/Physora.xcodeproj.zip
          fi
          if [ -d build/Build/Products/Debug-iphonesimulator/Physora.app ]; then
            ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/Physora.app artifacts/Physora-simulator.app.zip
          fi

      - name: Upload project and simulator build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Physora-simulator-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Physora-build-logs
          path: |
            build.log
            test.log
            TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14
