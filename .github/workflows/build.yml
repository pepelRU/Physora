name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode build and unit tests
    runs-on: macos-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Inspect committed Xcode project
        run: |
          xcodebuild -list -project Physora.xcodeproj

      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Physora.xcodeproj \
            -scheme Physora \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee build.log

      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "iPhone simulator: $UDID"
          echo "id=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project Physora.xcodeproj \
            -scheme Physora \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO | tee test.log

      - name: Capture simulator screenshots
        if: always()
        continue-on-error: true
        shell: bash
        env:
          UDID: ${{ steps.simulator.outputs.id }}
        run: |
          APP="build/Build/Products/Debug-iphonesimulator/Physora.app"
          if [ ! -d "$APP" ] || [ -z "$UDID" ]; then
            echo "App or simulator is unavailable"
            exit 0
          fi
          mkdir -p artifacts
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl terminate "$UDID" com.pepelru.physora 2>/dev/null || true
          xcrun simctl launch "$UDID" com.pepelru.physora
          sleep 5
          xcrun simctl io "$UDID" screenshot artifacts/home-light.png
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl terminate "$UDID" com.pepelru.physora 2>/dev/null || true
          xcrun simctl launch "$UDID" com.pepelru.physora
          sleep 4
          xcrun simctl io "$UDID" screenshot artifacts/home-dark.png

      - name: Package project and simulator app
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -d Physora.xcodeproj ]; then
            ditto -c -k --sequesterRsrc --keepParent Physora.xcodeproj artifacts/Physora.xcodeproj.zip
          fi
          if [ -d build/Build/Products/Debug-iphonesimulator/Physora.app ]; then
            ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/Physora.app artifacts/Physora-simulator.app.zip
          fi

      - name: Upload project and simulator build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Physora-simulator-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Physora-build-logs
          path: |
            build.log
            test.log
            TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14
